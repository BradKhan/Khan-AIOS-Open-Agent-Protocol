name: pr-policy
# Read-only PR check executes policy from base checkout, not PR code.
# A contributor can change the workflow definition in a PR. Require review and
# immutable required checks/rulesets; this job alone is not authorization.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pr-risk:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR commit graph as data only
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --no-recurse-submodules origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/openass-pr"
      - name: Apply policy from trusted base branch
        run: python3 scripts/pr_gate.py --event "$GITHUB_EVENT_PATH"
      - name: Static framework security baseline from base
        run: python3 scripts/security_baseline.py
